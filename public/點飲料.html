<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>點玉圓堂</title>
  <style>
    body::before {
      content: "";
      position: fixed;
      top: 0; left: 0;
      width: 100%;
      height: 100%;
      background-image: url('711.jpg');
      background-size: cover;
      background-position: center center;
      opacity: 0.15;
      z-index: -1;
      filter: brightness(0.8);
    }
    body {
      margin: 0;
      padding: 2rem;
      font-family: "Noto Sans TC", "Microsoft JhengHei", "PingFang TC", sans-serif;
      background-color: #f4f6f8;
      color: #2c3e50;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
    }
    .card {
      background:rgba(255,255,255,0.25);
      padding: 2.5rem 2.5rem 3rem;
      border-radius: 1.2rem;
      box-shadow: 0 16px 32px rgb(0,0,0,0.12);
      backdrop-filter: blur(3px);            
      -webkit-backdrop-filter: blur(12px);  
      max-width: 800px;
      width: 100%;
      transition: transform 0.3s ease,box-shadow 0.3s ease;
    }
    .card:hover {
      transform: translateY(-5px) scale(1.02);
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.3);
    }
    h2 {
      margin: 0 0 1.8rem 0;
      font-weight: 700;
      font-size: 1.8rem;
      letter-spacing: 0.08em;
      color: #34495e;
      text-align: center;
      user-select: none;
    }
    label {
      font-weight: 600;
      font-size: 1rem;
      margin-top: 1.3rem;
      display: block;
      user-select: none;
      color: #34495e;
    }
    input[type="password"] {
      width: 200px;
      padding: 6px;
      font-size: 1rem;
      border: 1px solid #ccc;
      border-radius: 5px;
    }
    select, input[type="password"], input[type="number"], input[type="text"] {
      width: 100%;
      padding: 0.55rem 1rem;
      margin-top: 0.4rem;
      border: 1.6px solid #bdc3c7;
      border-radius: 0.5rem;
      font-size: 1rem;
      transition: border-color 0.3s ease;
      font-weight: 500;
      color: #34495e;
      user-select: text;
      box-sizing: border-box;
    }
    select:focus, input:focus {
      border-color: #3498db;
      outline: none;
      box-shadow: 0 0 6px rgba(52, 152, 219, 0.35);
    }
    button {
      margin-top: 20px;
      width: 100%;
      background-color: #3498db;
      color: white;
      font-weight: 700;
      font-size: 1.1rem;
      padding: 0.8rem;
      border: none;
      border-radius: 0.7rem;
      cursor: pointer;
      box-shadow: 0 5px 15px rgb(52 152 219 / 0.4);
      transition: background-color 0.3s ease, box-shadow 0.3s ease;
      user-select: none;
    }
    button:hover {
      background-color: #2980b9;
      box-shadow: 0 7px 22px rgb(41 128 185 / 0.6);
    }
    button:active {
      transform: scale(0.97);
    }
    .submit-btn {
      margin-top: 1rem;
      background-color: #2ecc71;
      box-shadow: 0 5px 15px rgb(46 204 113 / 0.4);
    }
    .submit-btn:hover {
      background-color: #27ae60;
      box-shadow: 0 7px 22px rgb(39 174 96 / 0.6);
    }
    #historyOrders {
      margin-top: 2rem;
      max-width: 800px;
      overflow-x: auto;
      border-radius: 1rem;
      box-shadow: 0 12px 28px rgb(0 0 0 / 0.1);
      background-color: #fff;
      padding: 1.2rem 1rem;
      display: none; 
      user-select: none;
    }
    #historyOrders h3 {
      margin-top: 0;
      margin-bottom: 1rem;
      font-weight: 700;
      font-size: 1.3rem;
      color: #34495e;
      text-align: center;
    }
    #historyOrders table {
      width: 100%;
      border-collapse: separate;
      border-spacing: 0 12px;
      font-size: 1rem;
      color: #34495e;
      user-select: text;
    }
    #historyOrders thead tr {
      background-color: #3498db;
      color: white;
      font-weight: 600;
      letter-spacing: 0.06em;
      border-radius: 0.6rem;
    }
    #historyOrders thead th {
      padding: 12px 15px;
      text-align: left;
    }
    #historyOrders tbody tr {
      background: #ecf0f1;
      border-radius: 0.8rem;
      box-shadow: 0 2px 8px rgb(0 0 0 / 0.07);
      transition: background-color 0.2s ease;
    }
    #historyOrders tbody tr:hover {
      background-color: #d6e9ff;
    }
    #historyOrders tbody td {
      padding: 12px 15px;
      vertical-align: middle;
    }
  </style>
</head>
<body>
  <div class="card">
    <h2>點飲料!</h2>

 
    <div id="login">
      <label for="name">你是誰?：</label>
      <select id="name" aria-label="名字">
        <option value="Josie">Josie大哥大</option>
        <option value="王宥鈞">王宥鈞</option>
        <option value="石仲寧">石仲寧</option>
        <option value="何雅嫻">何雅嫻</option>
        <option value="黃百吉">黃百吉</option>
        <option value="李承熹">李承熹</option>
        <option value="李柏緯">李柏緯</option>
        <option value="李祐丞">李祐丞</option>
        <option value="顧妘妘">顧妘妘</option>
        <option value="杜詩喬">杜詩喬</option>
        <option value="卓承鋒">卓承鋒</option>
        <option value="周容">周容</option>
        <option value="林瑀暘">林瑀暘</option>
        <option value="洪竣諺">洪竣諺</option>
        <option value="許瑀宸">許瑀宸</option>
        <option value="許維庭">許維庭</option>
        <option value="陳逸穎">陳逸穎</option>
        <option value="陳靖宜">陳靖宜</option>
        <option value="景博翰">景博翰</option>
        <option value="黃立昀">黃立昀</option>
        <option value="詹越至">詹越至</option>
        <option value="廖軍堯">廖軍堯</option>
        <option value="侯程鈞">侯程鈞</option>
        <option value="藍珮珊">藍珮珊</option>
        <option value="闕居毅">闕居毅</option>
        <option value="李寬灝">李寬灝</option>
        <option value="林彧">林彧</option>
        <option value="陳律妤">陳律妤</option>
        <option value="陳棒棒">陳棒棒</option>
        <option value="楊以潔">楊以潔</option>
        <option value="張芷瑜">張芷瑜</option>
        <option value="陳育靜">陳育靜</option>
        <option value="陳樂軒">陳樂軒</option>
        <option value="黃薺禾">黃薺禾</option>
        <option value="董馥寧">董馥寧</option>
        <option value="簡鉦原">簡鉦原</option>
        <option value="江沛綺">江沛綺</option>
      </select>

      <label for="password">密碼：</label>
      <input type="password" id="password" aria-label="密碼" autocomplete="current-password" />

      <button onclick="login()">登入</button>
    </div>

  
    <div id="orderForm" aria-live="polite" aria-atomic="true" style="display:none;">
      
      <label for="item">選擇品項：</label>
      <select id="item" onchange="updateItem()" aria-label="選擇品項">
        <option value="" data-price="0">還沒選擇</option>
        <option value="黑糖粉圓鮮奶" data-price="55">黑糖粉圓鮮奶-55元</option>
        <option value="檸檬愛玉小紫蘇" data-price="50">檸檬愛玉小紫蘇-50元</option>
        <option value="綠茶多多" data-price="45">綠茶多多-45元</option>
        <option value="典藏茉香綠茶" data-price="30">典藏茉香綠茶-30元</option>
      </select>

      <label for="adds">要不要加料!</label>
      <select id="adds" aria-label="要不要加料!" disabled>
        <option value="不加料" data-price="0">先選要喝什麼</option>
        <option value="粉圓" data-price="10">粉圓 +10元</option>
        <option value="紅豆" data-price="10">紅豆 +10元</option>
        <option value="綠豆" data-price="10">綠豆 +10元</option>
        <option value="小紫蘇" data-price="10">小紫蘇 +10元</option>
        <option value="愛玉" data-price="15">愛玉 +15元</option>
        <option value="湯圓" data-price="15">湯圓 +15元</option>
        <option value="芋園" data-price="15">芋園 +15元</option>
        <option value="布丁" data-price="15">布丁 +15元</option>
      </select>
      
      <label for="quantity">數量：</label>
      <input type="number" id="quantity" min="1" value="1" />
      
   
      <label for="note">備註：</label>
      <input type="text" id="note" class="input-field" placeholder="例如：少冰、無糖、自備環保杯..." />
      <br><br>

      <button onclick="submitOrder()">送出訂單</button>
      <button onclick="loadUserOrders()" class="submit-btn">我訂了什麼?</button>

     
      <div id="historyOrders" aria-live="polite" aria-atomic="true">
        <h3>歷史訂單</h3>
        <table border="0" cellpadding="5" cellspacing="0" style="width:100%; max-width:800px;">
          <thead>
            <tr>
              <th>飲料</th>
              <th>加什麼料</th>
              <th>數量</th>
              <th>總計</th>
              <th>備註</th>
              <th>時間</th>
              <th>付過錢了嗎</th>
              <th>反悔了?</th>
            </tr>
          </thead>
          <tbody id="historyOrdersBody"></tbody>
        </table>
      </div>
    </div>

    <div id="status" aria-live="polite" style="margin-top:1rem; text-align:center; font-weight: bold; color: #2c3e50;"></div>
  </div>

  <script>
    const users = {
        "Josie" :"997",
        "王宥鈞" :"0925",
        "石仲寧" :"0227", 
        "何雅嫻" :"0702",
        "黃百吉" :"0928",
        "李承熹" :"0128",
        "李柏緯" :"0227",
        "李祐丞" :"0415",
        "顧妘妘" :"0114",
        "杜詩喬" :"0805",
        "卓承鋒" :"1025",
        "周容" :"0402",
        "林瑀暘" :"0914",
        "洪竣諺" :"0609",
        "許瑀宸" :"0810",
        "許維庭" :"0314",
        "陳逸穎" :"0102",
        "陳靖宜" :"1012",
        "景博翰" :"0311",
        "黃立昀" :"0616",
        "詹越至" :"0210",
        "廖軍堯" :"0617",
        "侯程鈞" :"0907",
        "藍珮珊" :"1113",
        "闕居毅" :"1219",
        "李寬灝" :"0123",
        "林彧" :"0829",
        "陳律妤" :"0227",
        "陳棒棒" :"0108",
        "楊以潔" :"1114",
        "張芷瑜" :"0523",
        "陳育靜" :"1007",
        "陳樂軒" :"0909",
        "黃薺禾" :"0922",
        "董馥寧" :"0714",
        "簡鉦原" :"0303",
        "江沛綺" :"0823"
    };

    let currentUser = null;

    function login() {
      const name = document.getElementById("name").value;
      const pwd = document.getElementById("password").value;
      if (users[name] === pwd) {
        currentUser = name;
        document.getElementById("login").style.display = "none";
        document.getElementById("orderForm").style.display = "block";
        document.getElementById("status").innerText = `Hello!!，${name}！`;
      } else {
        alert("密碼錯了");
      }
    }

    function updateItem() {
      const itemSelect = document.getElementById("item");
      const addsSelect = document.getElementById("adds");

      if (itemSelect.value === "") {
        addsSelect.disabled = true;
        addsSelect.selectedIndex = 0;
        addsSelect.options[0].text = "先選要喝什麼";
      } else {
        addsSelect.disabled = false;
        addsSelect.options[0].text = "不要加料 (+0元)";
      }
    }

    function submitOrder() {
      const itemSelect = document.getElementById("item");
      const addsSelect = document.getElementById("adds");
      const quantity = parseInt(document.getElementById("quantity").value, 10);
      const note = document.getElementById("note").value; 
      
      const itemName = itemSelect.value;
      const addsName = addsSelect.value;

      if (!itemName) {
        alert("請選擇要喝什麼飲料！");
        return;
      }

      const itemPrice = parseInt(itemSelect.options[itemSelect.selectedIndex].getAttribute('data-price'), 10) || 0;
      const addsPrice = parseInt(addsSelect.options[addsSelect.selectedIndex].getAttribute('data-price'), 10) || 0;
      
      const tprice = (itemPrice + addsPrice) * quantity;

      const order = {
        name: currentUser,
        item: itemName,
        adds: addsName,
        quantity: quantity,
        tprice: tprice,
        note: note,
        time: new Date().toISOString()
      };

      fetch('https://nudosys.onrender.com/order', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(order)
      })
      .then(res => res.json())
      .then(data => {
        if (data.success) {
          alert('訂單送出成功！總共是 ' + tprice + ' 元');
          document.getElementById("note").value = ""; 
          loadUserOrders(); 
        } else {
          alert('訂單送出失敗');
        }
      })
      .catch(() => alert('無法連接伺服器'));
    }

    function deleteOrder(id) {
      if (!confirm("你確定要刪除嗎？")) return;

      fetch(`https://nudosys.onrender.com/order/${id}`, {
        method: 'DELETE'
      })
      .then(res => res.json())
      .then(data => {
        if (data.success) {
          alert('刪除成功！');
          loadUserOrders();
        } else {
          alert('刪除失敗');
        }
      })
      .catch(() => alert('無法刪除資料'));
    }

    function loadUserOrders() {
      if (!currentUser) {
        alert("請先登入喔");
        return;
      }

      fetch('https://nudosys.onrender.com/orders')
      .then(res => res.json())
      .then(data => {
        const tbody = document.getElementById('historyOrdersBody');
        tbody.innerHTML = '';

        const userOrders = data.filter(order => order.name === currentUser);

        if (userOrders.length === 0) {
          tbody.innerHTML = `<tr><td colspan="8" style="text-align:center;">這裡空空如也</td></tr>`;
        } else {
          userOrders.forEach(order => {
            const tr = document.createElement('tr');
            tr.innerHTML = `
            <td>${order.item}</td>
            <td>${order.adds}</td>
            <td>${order.quantity}</td>
            <td style="color:#e67e22; font-weight:bold;">${order.tprice} 元</td>
            <td>${order.note || ''}</td> <!-- 顯示備註 -->
            <td>${new Date(order.time).toLocaleString()}</td>
            <td style="color:${order.done ? '#27ae60' : '#e74c3c'}; font-weight:700;">
            ${order.done ? '已經付錢' : '還沒付錢'}
            </td>
            <td>
            <button onclick="deleteOrder('${order.id}')" style="padding:4px 8px; font-size:0.9rem; background-color:#e74c3c; color:#fff; border:none; border-radius:6px; cursor:pointer; margin-top:0;">
            刪除
            </button>
            </td>
            `;
            tbody.appendChild(tr);
          });
        }

        document.getElementById('historyOrders').style.display = 'block';
      })
      .catch(() => alert('無法取得歷史訂單'));
    }
  </script>
</body>
</html>
