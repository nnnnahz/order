<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>點玉圓堂</title>
  <style>
    body::before {
      content: "";
      position: fixed;
      top: 0; left: 0;
      width: 100%;
      height: 100%;
      background-image: url('711.jpg');
      background-size: cover;
      background-position: center center;
      opacity: 0.15;
      z-index: -1;
      filter: brightness(0.8);
    }
    body {
      margin: 0;
      padding: 2rem;
      font-family: "Noto Sans TC", "Microsoft JhengHei", "PingFang TC", sans-serif;
      background-color: #f4f6f8;
      color: #2c3e50;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
    }
    .card {
      background:rgba(255,255,255,0.25);
      padding: 2.5rem 2.5rem 3rem;
      border-radius: 1.2rem;
      box-shadow: 0 16px 32px rgb(0,0,0,0.12);
      backdrop-filter: blur(3px);            
      -webkit-backdrop-filter: blur(12px);  
      max-width: 800px;
      width: 100%;
      transition: transform 0.3s ease,box-shadow 0.3s ease;
    }
    .card:hover {
      transform: translateY(-5px) scale(1.02);
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.3);
    }
    h2 {
      margin: 0 0 1.8rem 0;
      font-weight: 700;
      font-size: 1.8rem;
      letter-spacing: 0.08em;
      color: #34495e;
      text-align: center;
      user-select: none;
    }
    label {
      font-weight: 600;
      font-size: 1rem;
      margin-top: 1.3rem;
      display: block;
      user-select: none;
      color: #34495e;
    }
    input[type="password"] {
      width: 200px;
      padding: 6px;
      font-size: 1rem;
      border: 1px solid #ccc;
      border-radius: 5px;
    }
    select, input[type="password"], input[type="number"], input[type="text"] {
      width: 100%;
      padding: 0.55rem 1rem;
      margin-top: 0.4rem;
      border: 1.6px solid #bdc3c7;
      border-radius: 0.5rem;
      font-size: 1rem;
      transition: border-color 0.3s ease;
      font-weight: 500;
      color: #34495e;
      user-select: text;
      box-sizing: border-box;
    }
    select:focus, input:focus {
      border-color: #3498db;
      outline: none;
      box-shadow: 0 0 6px rgba(52, 152, 219, 0.35);
    }
    button {
      margin-top: 20px;
      width: 100%;
      background-color: #3498db;
      color: white;
      font-weight: 700;
      font-size: 1.1rem;
      padding: 0.8rem;
      border: none;
      border-radius: 0.7rem;
      cursor: pointer;
      box-shadow: 0 5px 15px rgb(52 152 219 / 0.4);
      transition: background-color 0.3s ease, box-shadow 0.3s ease;
      user-select: none;
    }
    button:hover {
      background-color: #2980b9;
      box-shadow: 0 7px 22px rgb(41 128 185 / 0.6);
    }
    button:active {
      transform: scale(0.97);
    }
    .submit-btn {
      margin-top: 1rem;
      background-color: #2ecc71;
      box-shadow: 0 5px 15px rgb(46 204 113 / 0.4);
    }
    .submit-btn:hover {
      background-color: #27ae60;
      box-shadow: 0 7px 22px rgb(39 174 96 / 0.6);
    }
    #historyOrders {
      margin-top: 2rem;
      max-width: 800px;
      overflow-x: auto;
      border-radius: 1rem;
      box-shadow: 0 12px 28px rgb(0 0 0 / 0.1);
      background-color: #fff;
      padding: 1.2rem 1rem;
      display: none; 
      user-select: none;
    }
    #historyOrders h3 {
      margin-top: 0;
      margin-bottom: 1rem;
      font-weight: 700;
      font-size: 1.3rem;
      color: #34495e;
      text-align: center;
    }
    #historyOrders table {
      width: 100%;
      border-collapse: separate;
      border-spacing: 0 12px;
      font-size: 1rem;
      color: #34495e;
      user-select: text;
    }
    #historyOrders thead tr {
      background-color: #3498db;
      color: white;
      font-weight: 600;
      letter-spacing: 0.06em;
      border-radius: 0.6rem;
    }
    #historyOrders thead th {
      padding: 12px 15px;
      text-align: left;
    }
    #historyOrders tbody tr {
      background: #ecf0f1;
      border-radius: 0.8rem;
      box-shadow: 0 2px 8px rgb(0 0 0 / 0.07);
      transition: background-color 0.2s ease;
    }
    #historyOrders tbody tr:hover {
      background-color: #d6e9ff;
    }
    #historyOrders tbody td {
      padding: 12px 15px;
      vertical-align: middle;
    }
  </style>
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>點玉圓堂</title>
  <style>
    body::before {
      content: ""; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background-image: url('711.jpg'); background-size: cover; background-position: center center;
      opacity: 0.15; z-index: -1; filter: brightness(0.8);
    }
    body { margin: 0; padding: 2rem; font-family: "Noto Sans TC", "Microsoft JhengHei", sans-serif; background-color: #f4f6f8; color: #2c3e50; display: flex; justify-content: center; align-items: flex-start; min-height: 100vh; }
    .card { background:rgba(255,255,255,0.25); padding: 2.5rem 2.5rem 3rem; border-radius: 1.2rem; box-shadow: 0 16px 32px rgb(0,0,0,0.12); backdrop-filter: blur(12px); max-width: 800px; width: 100%; }
    h2 { margin: 0 0 1.8rem 0; font-weight: 700; font-size: 1.8rem; text-align: center; }
    label { font-weight: 600; margin-top: 1.3rem; display: block; }
    select, input { width: 100%; padding: 0.55rem 1rem; margin-top: 0.4rem; border: 1.6px solid #bdc3c7; border-radius: 0.5rem; font-size: 1rem; box-sizing: border-box; }
    button { margin-top: 20px; width: 100%; background-color: #3498db; color: white; font-weight: 700; font-size: 1.1rem; padding: 0.8rem; border: none; border-radius: 0.7rem; cursor: pointer; }
    .submit-btn { background-color: #2ecc71; }
    #historyOrders { margin-top: 2rem; overflow-x: auto; background-color: #fff; padding: 1.2rem 1rem; display: none; border-radius: 1rem;}
    table { width: 100%; border-collapse: collapse; text-align: left; }
    th, td { padding: 12px; border-bottom: 1px solid #ddd; }
  </style>
</head>
<body>
  <div class="card">
    <h2>點飲料!</h2>
    <div id="login">
      <label for="name">你是誰?：</label>
      <select id="name">
        <option value="Josie">Josie大哥大</option>
        <option value="詹越至">詹越至</option>
        <option value="王宥鈞">王宥鈞</option>
        <!-- 其他人名省略，請自己補上原本的名單 -->
      </select>
      <label for="password">密碼：</label>
      <input type="password" id="password" />
      <button onclick="login()">登入</button>
    </div>

    <div id="orderForm" style="display:none;">
      <label for="item">要喝什麼?：</label>
      <select id="item" onchange="updateItem()">
        <option value="" data-price="0">我還沒選</option>
        <option value="黑糖粉圓鮮奶" data-price="55">黑糖粉圓鮮奶-55元</option>
        <option value="檸檬愛玉小紫蘇" data-price="50">檸檬愛玉小紫蘇-50元</option>
        <option value="綠茶多多" data-price="45">綠茶多多-45元</option>
        <option value="典藏茉香綠茶" data-price="30">典藏茉香綠茶-30元</option>
      </select>

      <label for="sugar">甜度</label>
      <select id="sugar" disabled>
        <option value="">先選要喝什麼</option>
        <option value="正常糖">正常糖</option>
        <option value="少糖">少糖</option>
        <option value="半糖">半糖</option>
        <option value="微糖">微糖</option>
        <option value="無糖">無糖</option>
      </select>

      <label for="ice">冰塊</label>
      <select id="ice" disabled>
        <option value="">先選要喝什麼</option>
        <option value="正常冰">正常冰</option>
        <option value="少冰">少冰</option>
        <option value="半冰">半冰</option>
        <option value="微冰">微冰</option>
        <option value="常溫">常溫</option>
        <option value="熱的">熱的</option>
      </select>
      
      <label for="adds">要不要加料!</label>
      <select id="adds" disabled>
        <option value="不加料" data-price="0">先選要喝什麼</option>
        <option value="粉圓" data-price="10">粉圓 +10元</option>
        <option value="紅豆" data-price="10">紅豆 +10元</option>
      </select>
      
      <label for="quantity">幾杯：</label>
      <input type="number" id="quantity" min="1" value="1" />
      
      <label for="note">備註：</label>
      <input type="text" id="note" placeholder="例如：加一杯無糖綠茶加雙倍珍珠" />
      
      <button onclick="submitOrder()">送出</button>
      <button onclick="loadUserOrders()" class="submit-btn">我訂了什麼?</button>

      <div id="historyOrders">
        <h3>我訂了什麼?</h3>
        <table>
          <thead>
            <tr>
              <th>飲料</th><th>甜度</th><th>冰塊</th><th>加料</th>
              <th>數量</th><th>總計</th><th>備註</th><th>時間</th><th>狀態</th><th>操作</th>
            </tr>
          </thead>
          <tbody id="historyOrdersBody"></tbody>
        </table>
      </div>
    </div>
    <div id="status" style="margin-top:1rem; text-align:center; font-weight: bold;"></div>
  </div>

  <script>
    const users = { "Josie":"997", "詹越至":"0210", "王宥鈞":"0925" }; // 請補齊你的密碼表
    let currentUser = null;

    function login() {
      const name = document.getElementById("name").value;
      const pwd = document.getElementById("password").value;
      if (users[name] === pwd) {
        currentUser = name;
        document.getElementById("login").style.display = "none";
        document.getElementById("orderForm").style.display = "block";
        document.getElementById("status").innerText = `Hello!!，${name}！`;
      } else { alert("密碼錯了"); }
    }

    function updateItem() {
      const item = document.getElementById("item").value;
      const disabled = item === "";
      document.getElementById("adds").disabled = disabled;
      document.getElementById("sugar").disabled = disabled;
      document.getElementById("ice").disabled = disabled;
      if(disabled) {
        document.getElementById("adds").options[0].text = "先選要喝什麼";
      } else {
        document.getElementById("adds").options[0].text = "不要加料 (+0元)";
      }
    }

    function submitOrder() {
      const itemSelect = document.getElementById("item");
      const addsSelect = document.getElementById("adds");
      if (!itemSelect.value) return alert("請選擇要喝什麼飲料！");

      const order = {
        name: currentUser,
        item: itemSelect.value,
        adds: addsSelect.value,
        sugar: document.getElementById("sugar").value,
        ice: document.getElementById("ice").value,
        quantity: parseInt(document.getElementById("quantity").value, 10),
        note: document.getElementById("note").value,
        time: new Date().toISOString()
      };

      const itemPrice = parseInt(itemSelect.options[itemSelect.selectedIndex].getAttribute('data-price')) || 0;
      const addsPrice = parseInt(addsSelect.options[addsSelect.selectedIndex].getAttribute('data-price')) || 0;
      order.tprice = (itemPrice + addsPrice) * order.quantity;

      // 【重點修改】使用相對路徑 /order
      fetch('/order', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(order)
      })
      .then(res => res.json())
      .then(data => {
        if (data.success) {
          alert('送出成功！總共是 ' + order.tprice + ' 元');
          document.getElementById("note").value = ""; 
          loadUserOrders(); 
        } else alert('送出失敗');
      })
      .catch(() => alert('無法連接伺服器'));
    }

    function loadUserOrders() {
      // 【重點修改】使用相對路徑 /orders
      fetch('/orders')
      .then(res => res.json())
      .then(data => {
        const tbody = document.getElementById('historyOrdersBody');
        tbody.innerHTML = '';
        const userOrders = data.filter(order => order.name === currentUser);

        if (userOrders.length === 0) {
          tbody.innerHTML = `<tr><td colspan="10" style="text-align:center;">這裡空空如也</td></tr>`;
        } else {
          userOrders.forEach(order => {
            tbody.innerHTML += `
              <tr>
                <td>${order.item}</td>
                <td>${order.sugar || ''}</td>
                <td>${order.ice || ''}</td>
                <td>${order.adds || ''}</td>
                <td>${order.quantity}</td>
                <td style="color:#e67e22; font-weight:bold;">${order.tprice} 元</td>
                <td>${order.note || ''}</td>
                <td>${new Date(order.time).toLocaleString()}</td>
                <td style="color:${order.done ? '#27ae60' : '#e74c3c'}; font-weight:700;">
                  ${order.done ? '已經付錢' : '還沒付錢'}
                </td>
                <td><button onclick="deleteOrder('${order.id}')" style="background:#e74c3c; padding:5px;">刪除</button></td>
              </tr>`;
          });
        }
        document.getElementById('historyOrders').style.display = 'block';
      });
    }

    function deleteOrder(id) {
      if (!confirm("你確定要刪除嗎？")) return;
      // 【重點修改】使用相對路徑 /order/id
      fetch(`/order/${id}`, { method: 'DELETE' })
      .then(res => res.json())
      .then(data => {
        if (data.success) { alert('刪除成功！'); loadUserOrders(); }
      });
    }
  </script>
</body>
</html>
